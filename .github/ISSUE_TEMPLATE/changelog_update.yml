name: CHANGELOG Update
about: Track a significant change that needs to be documented
title: '[CHANGELOG] '
labels: ['type: meta', 'component: docs', 'status: todo']
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 CHANGELOG Update Request
        Use this template when you need to document a significant change in the CHANGELOG.

  - type: dropdown
    id: change_type
    attributes:
      label: Change Type
      description: What type of change is this?
      options:
        - '✨ Added - New feature'
        - '🔧 Changed - Existing functionality change'
        - '🐛 Fixed - Bug fix'
        - '🗑️ Deprecated - Soon-to-be removed feature'
        - '⏪ Removed - Deleted feature'
        - '🔒 Security - Security fix or improvement'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Change Description
      description: Clear description of what changed
      placeholder: |
        Example:
        - Added support for GTK4 libadwaita themes
        - Fixed issue where buttons didn't render correctly in Cinnamon
        - Updated documentation with new installation instructions
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Target Version
      description: Which version should this be released in?
      placeholder: "e.g., 2.1.0 or Unreleased"

  - type: textarea
    id: details
    attributes:
      label: Additional Details
      description: Any technical details or context
      placeholder: |
        - Related PR: #123
        - Breaking changes: Yes/No
        - Migration guide needed: Yes/No

  - type: checkboxes
    id: checklist
    attributes:
      label: Documentation Checklist
      options:
        - label: CHANGELOG.md updated
        - label: Language translations updated (if needed)
        - label: Links verified
        - label: Version number correct
