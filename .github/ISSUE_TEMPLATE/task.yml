name: Task
about: Create a new task or to-do item
title: '[TASK] '
labels: ['type: task', 'status: todo']
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Task Creation
        Use this template for general tasks, to-do items, or organizational work.

  - type: input
    id: summary
    attributes:
      label: Task Summary
      description: Brief description of what needs to be done
      placeholder: "e.g., Update wiki navigation links"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this task?
      options:
        - 🔴 High (Blocking/Critical)
        - 🟡 Medium (Normal priority)
        - 🟢 Low (Nice to have)
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of task is this?
      options:
        - 📚 Documentation
        - 🎨 Design/UI
        - ⚙️ Configuration
        - 🧹 Maintenance/Cleanup
        - 📊 Analytics/Metrics
        - 🔧 Tooling
        - 🌐 Internationalization
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Detailed Description
      description: Provide detailed information about the task
      placeholder: |
        ## Context
        Why is this task needed?

        ## Requirements
        - Requirement 1
        - Requirement 2

        ## Acceptance Criteria
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Task Checklist
      description: Break down the task into smaller steps
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3

  - type: input
    id: estimated_time
    attributes:
      label: Estimated Time
      description: Rough estimate of how long this will take
      placeholder: "e.g., 2 hours, 1 day, 1 week"

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint Assignment
      description: Which sprint should this be assigned to?
      options:
        - Current Sprint
        - Next Sprint
        - Backlog
        - Unsure

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List any dependencies or blockers
      placeholder: |
        - Depends on #123
        - Blocked by PR #456
        - Related to issue #789
