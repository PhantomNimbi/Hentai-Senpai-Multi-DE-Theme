name: Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      force_update:
        description: 'Force update existing release (will replace if exists)'
        required: false
        default: false
        type: boolean
      specific_version:
        description: 'Specific version to release (overrides bump_type, e.g., 1.2.3)'
        required: false
        type: string

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get latest tag
        id: get_latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"
      
      - name: Calculate new version
        id: calc_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          CURRENT_VERSION=${LATEST_TAG#v}
          
          # Check if specific version is provided
          if [ -n "${{ github.event.inputs.specific_version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.specific_version }}"
            BUMP_TYPE="manual"
          else
            # Parse current version
            MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
            MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
            PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
            
            # Determine bump type
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              BUMP_TYPE="${{ github.event.inputs.bump_type }}"
            else
              BUMP_TYPE="patch"
            fi
            
            # Calculate new version
            case $BUMP_TYPE in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch|*)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          
          NEW_TAG="v$NEW_VERSION"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          
          echo "Current: $CURRENT_VERSION"
          echo "New: $NEW_VERSION"
          echo "Tag: $NEW_TAG"
          echo "Bump: $BUMP_TYPE"
      
      - name: Check if release exists
        id: check_release_exists
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          FORCE_UPDATE="${{ github.event.inputs.force_update }}"
          
          # Check if tag exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $NEW_TAG already exists"
            
            if [ "$FORCE_UPDATE" == "true" ]; then
              echo "force_update=true" >> $GITHUB_OUTPUT
              echo "Force update enabled - will replace existing release"
            else
              echo "force_update=false" >> $GITHUB_OUTPUT
              echo "Use workflow_dispatch with force_update=true to replace"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "force_update=false" >> $GITHUB_OUTPUT
            echo "Tag $NEW_TAG does not exist - will create new release"
          fi
      
      - name: Check if release needed
        id: check_release
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          FORCE_UPDATE="${{ steps.check_release_exists.outputs.force_update }}"
          EXISTS="${{ steps.check_release_exists.outputs.exists }}"
          
          # If force update is enabled, proceed regardless
          if [ "$FORCE_UPDATE" == "true" ]; then
            echo "Force update enabled - proceeding with release"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # If release already exists and no force update, skip
          if [ "$EXISTS" == "true" ]; then
            echo "Release $NEW_TAG already exists and force_update is false"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if there are commits since last tag
          if [ "$LATEST_TAG" == "v0.0.0" ]; then
            echo "No previous releases found. Creating first release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            COMMITS=$(git log $LATEST_TAG..HEAD --oneline --no-decorate 2>/dev/null | wc -l)
            if [ "$COMMITS" -gt 0 ]; then
              echo "Found $COMMITS commits since $LATEST_TAG"
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "No new commits since $LATEST_TAG"
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Delete existing release (if force update)
        if: steps.check_release.outputs.should_release == 'true' && steps.check_release_exists.outputs.exists == 'true'
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          
          echo "Deleting existing tag and release for $NEW_TAG..."
          
          # Delete the tag (this also deletes the associated release)
          git push origin :refs/tags/$NEW_TAG || true
          
          # Also try to delete via gh CLI in case release exists without tag
          gh release delete $NEW_TAG --yes 2>/dev/null || true
          
          echo "✅ Deleted existing release $NEW_TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update CHANGELOG
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          NEW_VERSION="${{ steps.calc_version.outputs.new_version }}"
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          DATE=$(date +%Y-%m-%d)
          
          # Get commits since last tag
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          if [ "$LATEST_TAG" != "v0.0.0" ]; then
            COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"- %s" --no-merges | head -20)
          else
            COMMITS="- Initial release"
          fi
          
          # Create new changelog section
          cat > new_changelog_section.md << EOF
          ## [$NEW_VERSION] - $DATE

          ### Changes
          $COMMITS

          EOF
          
          # Insert into CHANGELOG
          if [ -f CHANGELOG.md ]; then
            # Insert after the first line (title)
            head -n 1 CHANGELOG.md > temp_changelog.md
            echo "" >> temp_changelog.md
            cat new_changelog_section.md >> temp_changelog.md
            tail -n +2 CHANGELOG.md >> temp_changelog.md
            mv temp_changelog.md CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat new_changelog_section.md >> CHANGELOG.md
          fi
          
          echo "✅ Updated CHANGELOG.md"
          head -20 CHANGELOG.md
      
      - name: Update version in files
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          NEW_VERSION="${{ steps.calc_version.outputs.new_version }}"
          
          # Update index.theme if it exists
          if [ -f src/index.theme ]; then
            sed -i "s/Version=.*/Version=$NEW_VERSION/" src/index.theme
            echo "✅ Updated src/index.theme"
          fi
          
          # Update any version files
          echo "$NEW_VERSION" > VERSION
          echo "✅ Created VERSION file"
      
      - name: Commit version updates
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add CHANGELOG.md VERSION src/index.theme 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            IS_UPDATE="${{ steps.check_release_exists.outputs.exists }}"
            if [ "$IS_UPDATE" == "true" ]; then
              git commit -m "chore(release): update version to ${{ steps.calc_version.outputs.new_version }}

          - Updated CHANGELOG.md
          - Updated version files
          
          This is a forced update/replacement of the existing release.
          
          [skip ci]"
            else
              git commit -m "chore(release): bump version to ${{ steps.calc_version.outputs.new_version }}

          - Updated CHANGELOG.md
          - Updated version files
          
          [skip ci]"
            fi
            git push
            echo "✅ Committed version updates"
          fi
      
      - name: Create or update tag
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          IS_UPDATE="${{ steps.check_release_exists.outputs.exists }}"
          
          # Create annotated tag
          if [ "$IS_UPDATE" == "true" ]; then
            git tag -fa "$NEW_TAG" -m "Release $NEW_TAG (updated)"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          fi
          
          git push origin "$NEW_TAG" --force
          
          echo "✅ Created/updated tag: $NEW_TAG"
      
      - name: Create theme package
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.calc_version.outputs.new_version }}"
          THEME_NAME="Hentai-Senpai"
          
          # Clean and create release directory
          rm -rf release/
          mkdir -p release/${THEME_NAME}
          
          # Copy theme files
          cp -r src/* release/${THEME_NAME}/
          
          # Copy install script
          cp install.sh release/
          
          # Copy documentation
          cp README.md CHANGELOG.md release/ 2>/dev/null || true
          
          # Create version info
          cat > release/${THEME_NAME}/VERSION << EOF
          ${THEME_NAME} Theme v${VERSION}
          Released: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Commit: ${{ github.sha }}
          EOF
          
          # Create packages
          cd release
          tar -czf "${THEME_NAME}-v${VERSION}.tar.gz" *
          zip -r "${THEME_NAME}-v${VERSION}.zip" *
          
          echo "✅ Created packages:"
          ls -lh *.tar.gz *.zip
      
      - name: Generate detailed release notes
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
          BUMP_TYPE="${{ steps.calc_version.outputs.bump_type }}"
          IS_UPDATE="${{ steps.check_release_exists.outputs.exists }}"
          NEW_VERSION="${{ steps.calc_version.outputs.new_version }}"
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          # Start release notes
          cat > release_notes.md << EOF
          # Hentai-Senpai Theme v${NEW_VERSION}

          EOF

          if [ "$IS_UPDATE" == "true" ]; then
            cat >> release_notes.md << EOF
          > 🔄 This release has been updated/rebuilt on $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          EOF
          else
            cat >> release_notes.md << EOF
          > 📦 This is a **${BUMP_TYPE}** version bump release

          EOF
          fi

          # Get commit range
          if [ "$LATEST_TAG" != "v0.0.0" ] && [ "$IS_UPDATE" != "true" ]; then
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD~10..HEAD"
          fi

          # Count commits
          COMMIT_COUNT=$(git log $COMMIT_RANGE --oneline --no-merges 2>/dev/null | wc -l)
          
          cat >> release_notes.md << EOF
          ## 📊 Release Statistics

          - **Commits:** ${COMMIT_COUNT}
          - **Full Changelog:** [${LATEST_TAG}...${NEW_TAG}](${REPO_URL}/compare/${LATEST_TAG}...${NEW_TAG})

          EOF

          # Categorize changes
          echo "## 📝 Changes" >> release_notes.md
          echo "" >> release_notes.md

          # Features (feat: or feature:)
          FEATURES=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^.*\bfeat(ure)?\b.*:" || true)
          if [ -n "$FEATURES" ]; then
            echo "### ✨ Features" >> release_notes.md
            echo "$FEATURES" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Fixes (fix: or bugfix:)
          FIXES=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^.*\bfix\b.*:" || true)
          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> release_notes.md
            echo "$FIXES" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Documentation (docs:)
          DOCS=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^.*\bdocs\b.*:" || true)
          if [ -n "$DOCS" ]; then
            echo "### 📚 Documentation" >> release_notes.md
            echo "$DOCS" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Performance (perf: or performance:)
          PERF=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^.*\bperf(ormance)?\b.*:" || true)
          if [ -n "$PERF" ]; then
            echo "### ⚡ Performance" >> release_notes.md
            echo "$PERF" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Refactoring (refactor:)
          REFACTOR=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^.*\brefactor\b.*:" || true)
          if [ -n "$REFACTOR" ]; then
            echo "### 🔧 Refactoring" >> release_notes.md
            echo "$REFACTOR" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Other changes
          OTHER=$(git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges | grep -ivE "^.*\b(feat(ure)?|fix|docs|perf(ormance)?|refactor|chore|style|test)\b.*:" || true)
          if [ -n "$OTHER" ]; then
            echo "### 📝 Other Changes" >> release_notes.md
            echo "$OTHER" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # List all commits if no categorization worked
          if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$DOCS" ] && [ -z "$PERF" ] && [ -z "$REFACTOR" ] && [ -z "$OTHER" ]; then
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "### All Changes" >> release_notes.md
              git log $COMMIT_RANGE --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
              echo "" >> release_notes.md
            else
              echo "- No specific changes documented" >> release_notes.md
              echo "" >> release_notes.md
            fi
          fi

          # Contributors section
          echo "## 👥 Contributors" >> release_notes.md
          echo "" >> release_notes.md
          CONTRIBUTORS=$(git log $COMMIT_RANGE --pretty=format:"@%an" --no-merges | sort -u | head -10)
          if [ -n "$CONTRIBUTORS" ]; then
            echo "$CONTRIBUTORS" | tr '\n' ' ' >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "@PhantomNimbi" >> release_notes.md
          fi
          echo "" >> release_notes.md

          # File changes summary
          echo "## 📁 Files Changed" >> release_notes.md
          echo "" >> release_notes.md
          CHANGED_FILES=$(git diff --name-only $COMMIT_RANGE 2>/dev/null | wc -l)
          INSERTIONS=$(git diff --stat $COMMIT_RANGE 2>/dev/null | tail -1 | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          DELETIONS=$(git diff --stat $COMMIT_RANGE 2>/dev/null | tail -1 | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")
          echo "- **Files changed:** ${CHANGED_FILES}" >> release_notes.md
          echo "- **Lines added:** ${INSERTIONS}" >> release_notes.md
          echo "- **Lines removed:** ${DELETIONS}" >> release_notes.md
          echo "" >> release_notes.md

          # Installation section
          cat >> release_notes.md << EOF
          ## 🚀 Installation

          ### Quick Install
          \`\`\`bash
          # Download and extract
          tar -xzf Hentai-Senpai-v${NEW_VERSION}.tar.gz
          
          # Install the theme
          ./install.sh
          \`\`\`

          ### Complete Install (Recommended)
          \`\`\`bash
          # Install with all fixes: GTK4, Flatpak, and dock
          ./install.sh --update -l -f --dock
          
          # Apply the theme
          ./scripts/apply.sh
          \`\`\`

          ### Installation Options
          | Option | Description |
          |--------|-------------|
          | \`-l, --libadwaita\` | Fix GTK4/libadwaita applications |
          | \`-f, --flatpak\` | Fix Flatpak sandboxed apps |
          | \`--dock [TYPE]\` | Style dock (transparent\|solid) |
          | \`-w, --wallpapers\` | Install theme wallpapers |

          ## 📦 Package Contents

          - \`Hentai-Senpai/\` - Theme files (GTK 2/3/4, GNOME Shell, Cinnamon, XFCE)
          - \`install.sh\` - Installation script
          - \`README.md\` - Documentation
          - \`CHANGELOG.md\` - Version history

          ## 📚 Documentation & Support

          - 📖 [Full Documentation](${REPO_URL}/wiki)
          - 🐛 [Report Issues](${REPO_URL}/issues)
          - 💬 [Discussions](${REPO_URL}/discussions)

          ## 🎨 Theme Features

          - **Dark & Elegant** — Deep blue-gray backgrounds with Nord colors
          - **Multi-DE Support** — GNOME, Cinnamon, XFCE, Budgie, MATE
          - **Complete Theming** — GTK 2/3/4, GNOME Shell, window decorations
          - **Modern GTK4** — Full libadwaita support
          - **Flatpak Ready** — Sandboxed app support

          ---

          **Full Changelog**: [${LATEST_TAG}...${NEW_TAG}](${REPO_URL}/compare/${LATEST_TAG}...${NEW_TAG})

          EOF

          echo "✅ Generated detailed release notes"
          head -100 release_notes.md
      
      - name: Create or Update GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.calc_version.outputs.new_tag }}
          name: ${{ steps.calc_version.outputs.new_tag }}
          body_path: release_notes.md
          files: |
            release/Hentai-Senpai-v${{ steps.calc_version.outputs.new_version }}.tar.gz
            release/Hentai-Senpai-v${{ steps.calc_version.outputs.new_version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release Summary
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          IS_UPDATE="${{ steps.check_release_exists.outputs.exists }}"
          
          echo "=========================================="
          if [ "$IS_UPDATE" == "true" ]; then
            echo "  🔄 Release ${{ steps.calc_version.outputs.new_tag }} Updated!"
          else
            echo "  🎉 Release ${{ steps.calc_version.outputs.new_tag }} Published!"
          fi
          echo "=========================================="
          echo ""
          echo "Version: ${{ steps.calc_version.outputs.new_version }}"
          echo "Bump Type: ${{ steps.calc_version.outputs.bump_type }}"
          echo ""
          echo "Changes:"
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          git log $LATEST_TAG..HEAD --oneline --no-decorate 2>/dev/null || echo "See CHANGELOG.md"
      
      - name: Skip Summary
        if: steps.check_release.outputs.should_release == 'false'
        run: |
          EXISTS="${{ steps.check_release_exists.outputs.exists }}"
          
          if [ "$EXISTS" == "true" ]; then
            echo "⏭️ Release ${{ steps.calc_version.outputs.new_tag }} already exists"
            echo "   Use workflow_dispatch with force_update=true to update it"
          else
            echo "⏭️ No new commits - skipping release"
          fi
