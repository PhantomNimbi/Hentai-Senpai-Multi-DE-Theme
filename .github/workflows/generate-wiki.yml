name: Generate GitHub Wiki

on:
  push:
    branches:
      - docs
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update wiki from docs branch'
        required: false
        default: false
        type: boolean

jobs:
  generate-wiki:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository (for workflow context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-content
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Generate wiki content from docs branch
        run: |
          # Create Home.md with translate button
          cat > wiki/Home.md << 'EOF'
          <div align="right">
            <a href="#translation-options" style="text-decoration: none;">
              <img src="https://img.shields.io/badge/🌐%20Translate-2E3440?style=for-the-badge&color=2E3440&logoColor=white" alt="Translate">
            </a>
          </div>
          
          <div id="translation-options" style="margin-top: 10px; padding: 10px; background: #3B4252; border-radius: 6px; display: inline-block;">
            <strong>🌐 Available Languages:</strong><br>
            <a href="Home">English</a> •
            <a href="Home-pt">Português</a> •
            <a href="Home-es">Español</a>
          </div>
          
          # Hentai-Senpai Theme
          
          A beautiful dark GTK theme based on Orchis with Nord colors.
          
          ## Quick Links
          
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          - [Color Palette](Color-Palette)
          - [Contributing](Contributing)
          
          ## Quick Start
          
          ```bash
          ./install.sh --update -l -f --dock
          ./apply-theme.sh
          ```
          
          ## Features
          
          - Dark & Elegant Nord colors
          - Material Design principles
          - Multi-DE Support (GNOME, Cinnamon, XFCE, Budgie, MATE)
          - GTK 2/3/4, GNOME Shell, window decorations
          - Modern GTK4/libadwaita support
          - Flatpak Ready
          
          [View on GitHub](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme)
          EOF
          
          # Copy all docs from docs branch to wiki
          if [ -d "docs-content/docs" ]; then
            cp docs-content/docs/INSTALLATION.md wiki/Installation-Guide.md
            cp docs-content/docs/TROUBLESHOOTING.md wiki/Troubleshooting.md
            cp docs-content/docs/CUSTOMIZATION.md wiki/Customization.md
            cp docs-content/docs/COLOR_PALETTE.md wiki/Color-Palette.md
            cp docs-content/docs/CONTRIBUTING.md wiki/Contributing.md
            
            # Copy translation pages if they exist
            for file in docs-content/docs/*-*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "wiki/$filename"
              fi
            done
            
            echo "✅ Wiki content generated from docs branch"
          else
            echo "⚠️  docs/ directory not found in docs branch"
            exit 1
          fi
      
      - name: Ensure wiki navigation exists
        run: |
          # Create _Sidebar.md
          cat > wiki/_Sidebar.md << 'EOF'
          ## Navigation
          
          [Home](Home)
          
          ### Guides
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          
          ### Reference
          - [Color Palette](Color-Palette)
          
          ### Contributing
          - [Contributing Guide](Contributing)
          
          ---
          
          [GitHub Repository](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme)
          EOF
          
          # Create _Footer.md
          cat > wiki/_Footer.md << 'EOF'
          **Hentai-Senpai Theme** - A beautiful dark GTK theme
          
          [GitHub](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme) • [Issues](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme/issues)
          EOF
          
          echo "✅ Navigation created"
      
      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to wiki"
          else
            git commit -m "Update wiki from docs branch
          
          - Synchronized documentation from docs branch
          - Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "✅ Wiki updated successfully"
          fi
