name: Generate GitHub Wiki

on:
  push:
    branches:
      - docs
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update wiki from docs branch'
        required: false
        default: false
        type: boolean

jobs:
  generate-wiki:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository (for workflow context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-content
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Generate wiki content from docs branch
        run: |
          # Create Home.md with language selector
          cat > wiki/Home.md << 'EOF'
          <div align="right" style="margin-bottom: 20px;">
            <details>
              <summary style="background: #2E3440; color: #D8DEE9; border: 1px solid #4C566A; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; list-style: none;">🌐 Language</summary>
              <div style="margin-top: 10px; padding: 12px; background: #3B4252; border: 1px solid #4C566A; border-radius: 6px; text-align: right;">
                <div style="margin-bottom: 6px;"><a href="Home" style="color: #88C0D0; text-decoration: none;">🇺🇸 English</a></div>
                <div style="margin-bottom: 6px;"><a href="Home-pt-br" style="color: #88C0D0; text-decoration: none;">🇧🇷 Português</a></div>
                <div><a href="Home-es-es" style="color: #88C0D0; text-decoration: none;">🇪🇸 Español</a></div>
              </div>
            </details>
          </div>
          
          # Hentai-Senpai Theme
          
          A beautiful dark GTK theme based on Orchis with Nord colors.
          
          ## Quick Links
          
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          - [Color Palette](Color-Palette)
          - [Contributing](Contributing)
          
          ## Quick Start
          
          ```bash
          ./install.sh --update -l -f --dock
          ./apply-theme.sh
          ```
          
          ## Features
          
          - Dark & Elegant Nord colors
          - Material Design principles
          - Multi-DE Support (GNOME, Cinnamon, XFCE, Budgie, MATE)
          - GTK 2/3/4, GNOME Shell, window decorations
          - Modern GTK4/libadwaita support
          - Flatpak Ready
          
          [View on GitHub](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme)
          EOF
          
          # Copy all docs from docs branch to wiki (locale-based structure)
          if [ -d "docs-content/docs" ]; then
            # English (default)
            if [ -d "docs-content/docs/en-us" ]; then
              cp docs-content/docs/en-us/INSTALLATION.md wiki/Installation-Guide.md
              cp docs-content/docs/en-us/TROUBLESHOOTING.md wiki/Troubleshooting.md
              cp docs-content/docs/en-us/CUSTOMIZATION.md wiki/Customization.md
              cp docs-content/docs/en-us/COLOR_PALETTE.md wiki/Color-Palette.md
              cp docs-content/docs/en-us/CONTRIBUTING.md wiki/Contributing.md
              echo "✅ English documentation copied"
            fi
            
            # Portuguese (Brazil)
            if [ -d "docs-content/docs/pt-br" ]; then
              cp docs-content/docs/pt-br/INSTALLATION.md wiki/Installation-Guide-pt-br.md
              cp docs-content/docs/pt-br/TROUBLESHOOTING.md wiki/Troubleshooting-pt-br.md
              cp docs-content/docs/pt-br/CUSTOMIZATION.md wiki/Customization-pt-br.md
              cp docs-content/docs/pt-br/COLOR_PALETTE.md wiki/Color-Palette-pt-br.md
              cp docs-content/docs/pt-br/CONTRIBUTING.md wiki/Contributing-pt-br.md
              echo "✅ Portuguese documentation copied"
            fi
            
            # Spanish
            if [ -d "docs-content/docs/es-es" ]; then
              cp docs-content/docs/es-es/INSTALLATION.md wiki/Installation-Guide-es-es.md
              cp docs-content/docs/es-es/TROUBLESHOOTING.md wiki/Troubleshooting-es-es.md
              cp docs-content/docs/es-es/CUSTOMIZATION.md wiki/Customization-es-es.md
              cp docs-content/docs/es-es/COLOR_PALETTE.md wiki/Color-Palette-es-es.md
              cp docs-content/docs/es-es/CONTRIBUTING.md wiki/Contributing-es-es.md
              cp docs-content/docs/es-es/Home.md wiki/Home-es-es.md
              echo "✅ Spanish documentation copied"
            fi
            
            # Copy Home pages from each locale
            if [ -f "docs-content/docs/en-us/Home.md" ]; then
              cp docs-content/docs/en-us/Home.md wiki/Home.md
              echo "✅ Home page updated"
            fi
            
            if [ -f "docs-content/docs/pt-br/Home.md" ]; then
              cp docs-content/docs/pt-br/Home.md wiki/Home-pt-br.md
              echo "✅ Portuguese Home page copied"
            fi
            
            echo "✅ Wiki content generated from docs branch"
          else
            echo "⚠️  docs/ directory not found in docs branch"
            exit 1
          fi
      
      - name: Ensure wiki navigation exists
        run: |
          # Create _Sidebar.md
          cat > wiki/_Sidebar.md << 'EOF'
          ## Navigation
          
          [Home](Home)
          
          ### Guides
          - [Installation Guide](Installation-Guide)
            - [🇧🇷 Português](Installation-Guide-pt-br)
            - [🇪🇸 Español](Installation-Guide-es-es)
          - [Troubleshooting](Troubleshooting)
            - [🇧🇷 Português](Troubleshooting-pt-br)
            - [🇪🇸 Español](Troubleshooting-es-es)
          - [Customization](Customization)
            - [🇧🇷 Português](Customization-pt-br)
            - [🇪🇸 Español](Customization-es-es)
          
          ### Reference
          - [Color Palette](Color-Palette)
            - [🇧🇷 Português](Color-Palette-pt-br)
            - [🇪🇸 Español](Color-Palette-es-es)
          
          ### Contributing
          - [Contributing Guide](Contributing)
            - [🇧🇷 Português](Contributing-pt-br)
            - [🇪🇸 Español](Contributing-es-es)
          
          ---
          
          [GitHub Repository](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme)
          EOF
          
          # Create _Footer.md
          cat > wiki/_Footer.md << 'EOF'
          **Hentai-Senpai Theme** - A beautiful dark GTK theme
          
          [GitHub](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme) • [Issues](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme/issues)
          EOF
          
          echo "✅ Navigation created"
      
      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to wiki"
          else
            git commit -m "Update wiki from docs branch
          
          - Synchronized documentation from docs branch
          - Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "✅ Wiki updated successfully"
          fi
