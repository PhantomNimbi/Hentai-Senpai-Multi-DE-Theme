name: Generate GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/generate-wiki.yml'
  workflow_dispatch:
    inputs:
      sync_from_docs:
        description: 'Sync documentation from docs/ directory (uncheck if docs/ removed)'
        required: true
        default: true
        type: boolean

jobs:
  generate-wiki:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Check if docs directory exists
        id: check_docs
        run: |
          if [ -d "docs" ] && [ "${{ github.event.inputs.sync_from_docs }}" != "false" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ docs/ directory found - will sync from docs/"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.sync_from_docs }}" == "false" ]; then
              echo "ℹ️  docs/ sync disabled via workflow input"
            else
              echo "ℹ️  docs/ directory not found - wiki will use existing content"
            fi
          fi
      
      - name: Generate wiki content from docs
        if: steps.check_docs.outputs.exists == 'true'
        run: |
          # Create Home.md from README and docs content
          cat > wiki/Home.md << 'EOF'
          # Hentai-Senpai Theme
          
          A beautiful dark GTK theme based on Orchis with Nord colors.
          
          ## Quick Links
          
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          - [Color Palette](Color-Palette)
          - [Contributing](Contributing)
          
          ## Quick Start
          
          ```bash
          ./install.sh --update -l -f --dock
          ./apply-theme.sh
          ```
          
          ## Features
          
          - Dark & Elegant Nord colors
          - Material Design principles
          - Multi-DE Support (GNOME, Cinnamon, XFCE, Budgie, MATE)
          - GTK 2/3/4, GNOME Shell, window decorations
          - Modern GTK4/libadwaita support
          - Flatpak Ready
          
          [View on GitHub](https://github.com/${{ github.repository }})
          
          ---
          
          **Note:** This wiki is generated from the repository docs/ directory. Once the wiki is created, the docs/ directory can be removed from the repository if desired. The wiki will remain as the primary documentation source.
          EOF
          
          # Convert docs to wiki pages (only if they exist)
          [ -f docs/INSTALLATION.md ] && cp docs/INSTALLATION.md wiki/Installation-Guide.md
          [ -f docs/TROUBLESHOOTING.md ] && cp docs/TROUBLESHOOTING.md wiki/Troubleshooting.md
          [ -f docs/CUSTOMIZATION.md ] && cp docs/CUSTOMIZATION.md wiki/Customization.md
          [ -f docs/COLOR_PALETTE.md ] && cp docs/COLOR_PALETTE.md wiki/Color-Palette.md
          [ -f docs/CONTRIBUTING.md ] && cp docs/CONTRIBUTING.md wiki/Contributing.md
          
          echo "✅ Wiki content generated from docs/"
      
      - name: Ensure wiki navigation exists
        run: |
          # Create _Sidebar.md for navigation (only if not exists or docs changed)
          if [ ! -f wiki/_Sidebar.md ] || [ "${{ steps.check_docs.outputs.exists }}" == "true" ]; then
            cat > wiki/_Sidebar.md << 'EOF'
          ## Navigation
          
          [Home](Home)
          
          ### Guides
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          
          ### Reference
          - [Color Palette](Color-Palette)
          
          ### Contributing
          - [Contributing Guide](Contributing)
          
          ---
          
          [GitHub Repository](https://github.com/${{ github.repository }})
          EOF
          fi
          
          # Create _Footer.md (only if not exists or docs changed)
          if [ ! -f wiki/_Footer.md ] || [ "${{ steps.check_docs.outputs.exists }}" == "true" ]; then
            cat > wiki/_Footer.md << 'EOF'
          **Hentai-Senpai Theme** - A beautiful dark GTK theme
          
          [GitHub](https://github.com/${{ github.repository }}) • [Issues](https://github.com/${{ github.repository }}/issues)
          EOF
          fi
      
      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Add all files
          git add .
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to wiki"
          else
            if [ "${{ steps.check_docs.outputs.exists }}" == "true" ]; then
              git commit -m "Update wiki from docs directory
          
          - Synchronized documentation with main repository
          - Source: docs/ directory
          - Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            else
              git commit -m "Update wiki
          
          - Wiki maintained independently
          - Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            fi
            git push
            echo "✅ Wiki updated successfully"
          fi
      
      - name: Update repository README with wiki link
        if: steps.check_docs.outputs.exists == 'true'
        run: |
          # Add wiki link to main README.md if not present
          if [ -f README.md ] && ! grep -q "github.com/${{ github.repository }}/wiki" README.md; then
            sed -i '2a\
📚 **[Documentation Wiki](https://github.com/'${{ github.repository }}'/wiki)**' README.md
            echo "✅ Added wiki link to README.md"
          fi
