name: Generate GitHub Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update wiki from docs (if docs still exists)'
        required: false
        default: false
        type: boolean

jobs:
  generate-wiki:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Check if docs directory exists
        id: check_docs
        run: |
          if [ -d "docs" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ docs/ directory found - will sync to wiki"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️  docs/ directory not found - wiki is independent"
          fi
      
      - name: Generate wiki content from docs
        if: steps.check_docs.outputs.exists == 'true'
        run: |
          # Create Home.md
          cat > wiki/Home.md << 'EOF'
          🌐 **Translations**: [English](Home) | [Português](Home-pt) | [Español](Home-es)
          
          ---
          
          # Hentai-Senpai Theme
          
          A beautiful dark GTK theme based on Orchis with Nord colors.
          
          ## Quick Links
          
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          - [Color Palette](Color-Palette)
          - [Contributing](Contributing)
          
          ## Quick Start
          
          ```bash
          ./install.sh --update -l -f --dock
          ./apply-theme.sh
          ```
          
          ## Features
          
          - Dark & Elegant Nord colors
          - Material Design principles
          - Multi-DE Support (GNOME, Cinnamon, XFCE, Budgie, MATE)
          - GTK 2/3/4, GNOME Shell, window decorations
          - Modern GTK4/libadwaita support
          - Flatpak Ready
          
          [View on GitHub](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme)
          EOF
          
          # Copy all docs to wiki
          cp docs/INSTALLATION.md wiki/Installation-Guide.md
          cp docs/TROUBLESHOOTING.md wiki/Troubleshooting.md
          cp docs/CUSTOMIZATION.md wiki/Customization.md
          cp docs/COLOR_PALETTE.md wiki/Color-Palette.md
          cp docs/CONTRIBUTING.md wiki/Contributing.md
          
          echo "✅ Wiki content generated from docs/"
      
      - name: Ensure wiki navigation exists
        run: |
          # Create _Sidebar.md
          cat > wiki/_Sidebar.md << 'EOF'
          ## Navigation
          
          [Home](Home)
          
          ### Guides
          - [Installation Guide](Installation-Guide)
          - [Troubleshooting](Troubleshooting)
          - [Customization](Customization)
          
          ### Reference
          - [Color Palette](Color-Palette)
          
          ### Contributing
          - [Contributing Guide](Contributing)
          
          ---
          
          [GitHub Repository](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme)
          EOF
          
          # Create _Footer.md
          cat > wiki/_Footer.md << 'EOF'
          **Hentai-Senpai Theme** - A beautiful dark GTK theme
          
          [GitHub](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme) • [Issues](https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme/issues)
          EOF
          
          echo "✅ Navigation created"
      
      - name: Commit and push wiki
        working-directory: wiki
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to wiki"
          else
            git commit -m "Initial wiki creation from docs directory
          
          - Migrated all documentation from repository
          - Wiki is now the primary documentation source
          - Created: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "✅ Wiki created successfully"
          fi
      
      - name: Delete docs folder from repository
        if: steps.check_docs.outputs.exists == 'true'
        run: |
          echo "🗑️  Removing docs/ directory from repository..."
          rm -rf docs/
          echo "✅ docs/ directory removed"
      
      - name: Commit docs removal
        if: steps.check_docs.outputs.exists == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "docs: remove docs/ directory - documentation moved to wiki
          
          All documentation has been migrated to the GitHub Wiki.
          The wiki is now the primary and only documentation source.
          
          View documentation at: https://github.com/PhantomNimbi/Hentai-Senpai-GTK-Theme/wiki
          
          This change reduces repository size and centralizes docs."
            git push
            echo "✅ docs/ directory deletion committed and pushed"
          fi
