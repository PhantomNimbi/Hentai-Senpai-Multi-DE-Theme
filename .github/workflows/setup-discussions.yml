name: Setup GitHub Discussions

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'setup-all'
        type: choice
        options:
          - setup-all
          - enable-discussions
          - create-posts
          - check-status

jobs:
  setup-discussions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        
      - name: Checkout discussions branch
        uses: actions/checkout@v4
        with:
          ref: discussions
          path: discussions-content
          
      - name: Setup Discussions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Get inputs
            const action = '${{ github.event.inputs.action }}';
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            
            console.log('═══════════════════════════════════════════════════');
            console.log('🚀 GitHub Discussions Setup');
            console.log('═══════════════════════════════════════════════════');
            console.log('Repository: ' + owner + '/' + repo);
            console.log('Action: ' + action);
            console.log('');
            
            // Check function
            async function checkStatus() {
              console.log('🔍 Checking repository status...');
              
              try {
                const result = await github.graphql(`
                  query CheckDiscussions($owner: String!, $repo: String!) {
                    repository(owner: $owner, name: $repo) {
                      id
                      hasDiscussionsEnabled
                      discussionCategories(first: 20) {
                        nodes {
                          id
                          name
                          emoji
                          description
                        }
                      }
                    }
                  }
                `, { owner, repo });
                
                return {
                  enabled: result.repository.hasDiscussionsEnabled,
                  repoId: result.repository.id,
                  categories: result.repository.discussionCategories.nodes
                };
              } catch (error) {
                console.error('❌ Error checking status:', error.message);
                throw error;
              }
            }
            
            // Enable discussions function
            async function enableDiscussions(repoId) {
              console.log('🔄 Enabling discussions...');
              
              try {
                const result = await github.graphql(`
                  mutation EnableDiscussions($repositoryId: ID!) {
                    enableDiscussions(input: { repositoryId: $repositoryId }) {
                      repository {
                        id
                        hasDiscussionsEnabled
                      }
                    }
                  }
                `, { repositoryId: repoId });
                
                console.log('✅ Discussions enabled successfully!');
                return result.enableDiscussions.repository.hasDiscussionsEnabled;
              } catch (error) {
                console.error('❌ Error enabling discussions:', error.message);
                if (error.message.includes('permission') || error.message.includes('access')) {
                  console.log('   ℹ️  Your token needs admin permissions to enable discussions.');
                  console.log('   Go to Settings → Discussions and enable manually.');
                }
                throw error;
              }
            }
            
            // Read template
            function readTemplate(filename) {
              try {
                const content = fs.readFileSync(path.join('discussions-content/.github/DISCUSSION_TEMPLATE', filename), 'utf8');
                return content;
              } catch (e) {
                console.log('⚠️  Could not read template ' + filename + ': ' + e.message);
                return null;
              }
            }
            
            // Create discussion function
            async function createDiscussion(repoId, categoryId, title, body) {
              try {
                const result = await github.graphql(`
                  mutation CreateDiscussion($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                    createDiscussion(input: {
                      repositoryId: $repositoryId,
                      categoryId: $categoryId,
                      title: $title,
                      body: $body
                    }) {
                      discussion {
                        id
                        number
                        url
                        title
                      }
                    }
                  }
                `, {
                  repositoryId: repoId,
                  categoryId: categoryId,
                  title: title,
                  body: body
                });
                
                return { success: true, discussion: result.createDiscussion.discussion };
              } catch (error) {
                return { success: false, error: error.message };
              }
            }
            
            // Required categories and their posts
            const setupConfig = [
              {
                categoryName: 'General',
                emoji: '💬',
                description: 'General conversations about the theme',
                post: {
                  title: '👋 Welcome to Hentai-Senpai Discussions!',
                  template: 'general.md',
                  fallback: 'Welcome to the Hentai-Senpai community! 🎨\n\n' +
                    'This is a space for general conversations about the theme, sharing ideas, and connecting with other users.\n\n' +
                    '## Quick Links\n' +
                    '- 📖 [Installation Guide](https://github.com/' + owner + '/' + repo + '/wiki/Installation-Guide)\n' +
                    '- 🐛 [Report Issues](https://github.com/' + owner + '/' + repo + '/issues)\n' +
                    '- 🎨 [View Gallery](https://github.com/' + owner + '/' + repo + '/wiki/Gallery)\n\n' +
                    '## Community Guidelines\n' +
                    '- Be respectful and constructive\n' +
                    '- Search before posting\n' +
                    '- Use appropriate categories\n' +
                    '- Have fun! ✨'
                }
              },
              {
                categoryName: 'Q&A',
                emoji: '❓',
                description: 'Questions and troubleshooting',
                post: {
                  title: '❓ Frequently Asked Questions',
                  template: 'q-a.md',
                  fallback: '## Common Questions\n\n' +
                    '### How do I install the theme?\n' +
                    'Run `./install.sh` from the repository root.\n\n' +
                    '### Which desktop environments are supported?\n' +
                    'GNOME, Cinnamon, XFCE, MATE, and Budgie.\n\n' +
                    '### How do I apply the theme?\n' +
                    'Use the included `scripts/apply.sh` script or your desktop settings.\n\n' +
                    '### Need more help?\n' +
                    'Check the [Wiki](https://github.com/' + owner + '/' + repo + '/wiki) for detailed guides!'
                }
              },
              {
                categoryName: 'Showcase',
                emoji: '🎨',
                description: 'Share your desktop setups',
                post: {
                  title: '🎨 Desktop Showcase - Share Your Setup!',
                  template: 'showcase.md',
                  fallback: 'Show off your desktop setup featuring Hentai-Senpai theme!\n\n' +
                    '## How to Participate\n' +
                    '1. Take a screenshot of your desktop\n' +
                    '2. Share details (DE, distro, customizations)\n' +
                    '3. Post below\n\n' +
                    'Best setups will be featured in our README! 🌟'
                }
              },
              {
                categoryName: 'Ideas',
                emoji: '💡',
                description: 'Feature suggestions and ideas',
                post: {
                  title: '💡 Feature Request Hub',
                  template: 'ideas.md',
                  fallback: 'Have an idea for improving Hentai-Senpai? Share it here!\n\n' +
                    '## How to Submit\n' +
                    '- Describe your idea clearly\n' +
                    '- Explain the use case\n' +
                    '- Vote on existing ideas with 👍\n\n' +
                    'Popular requests will be added to our roadmap! 🗺️'
                }
              },
              {
                categoryName: 'Development',
                emoji: '🔧',
                description: 'Developer discussions',
                post: {
                  title: '🔧 Developer Discussions',
                  template: 'development.md',
                  fallback: 'Welcome developers! 👋\n\n' +
                    'This category is for technical discussions about:\n' +
                    '- Theme development\n' +
                    '- Code contributions\n' +
                    '- Architecture decisions\n' +
                    '- Testing and CI/CD\n\n' +
                    'Check out [good first issues](https://github.com/' + owner + '/' + repo + '/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) to get started!'
                }
              }
            ];
            
            // Main logic
            try {
              let status = await checkStatus();
              
              // Check status only
              if (action === 'check-status') {
                console.log('\n📊 Status Report:');
                console.log('   Discussions Enabled: ' + (status.enabled ? '✅ Yes' : '❌ No'));
                console.log('   Categories Found: ' + status.categories.length);
                
                if (status.categories.length > 0) {
                  console.log('\n   Categories:');
                  status.categories.forEach(cat => {
                    console.log('   - ' + cat.name);
                  });
                }
                
                const missingCategories = setupConfig.filter(config => 
                  !status.categories.some(cat => 
                    cat.name.toLowerCase().includes(config.categoryName.toLowerCase())
                  )
                );
                
                if (missingCategories.length > 0) {
                  console.log('\n   Missing Categories:');
                  missingCategories.forEach(config => {
                    console.log('   - ' + config.emoji + ' ' + config.categoryName);
                  });
                  console.log('\n   Create them at: https://github.com/' + owner + '/' + repo + '/discussions/categories');
                }
                
                console.log('\n✅ Status check complete!');
                return;
              }
              
              // Enable discussions if needed
              if (action === 'enable-discussions' || (action === 'setup-all' && !status.enabled)) {
                if (!status.enabled) {
                  console.log('Discussions are currently disabled.');
                  await enableDiscussions(status.repoId);
                  status = await checkStatus(); // Refresh status
                } else {
                  console.log('✅ Discussions are already enabled.');
                }
                
                if (action === 'enable-discussions') {
                  console.log('\n⚠️  Next: Create categories manually at:');
                  console.log('   https://github.com/' + owner + '/' + repo + '/discussions/categories');
                  console.log('\n   Required categories:');
                  setupConfig.forEach(config => {
                    console.log('   - ' + config.emoji + ' ' + config.categoryName + ': ' + config.description);
                  });
                  return;
                }
              }
              
              // Create posts
              if (action === 'create-posts' || action === 'setup-all') {
                if (!status.enabled) {
                  console.error('❌ ERROR: Discussions are not enabled!');
                  console.log('   Run with "enable-discussions" first, or enable manually.');
                  core.setFailed('Discussions not enabled');
                  return;
                }
                
                console.log('\n📝 Creating Discussion Posts...\n');
                
                const results = [];
                
                for (const config of setupConfig) {
                  // Find matching category
                  const category = status.categories.find(cat => 
                    cat.name.toLowerCase().includes(config.categoryName.toLowerCase()) ||
                    config.categoryName.toLowerCase().includes(cat.name.toLowerCase())
                  );
                  
                  if (!category) {
                    console.log('⏭️  Skipping "' + config.post.title + '" - Category "' + config.categoryName + '" not found');
                    console.log('   Create it manually at: https://github.com/' + owner + '/' + repo + '/discussions/categories');
                    console.log('');
                    results.push({ category: config.categoryName, title: config.post.title, status: 'skipped', reason: 'Category not found' });
                    continue;
                  }
                  
                  console.log('🔄 Creating: ' + config.post.title);
                  console.log('   Category: ' + category.name + ' (' + category.id + ')');
                  
                  // Read template or use fallback
                  let body = readTemplate(config.post.template);
                  if (!body) {
                    console.log('   Using fallback content');
                    body = config.post.fallback;
                  } else {
                    console.log('   Using template: ' + config.post.template);
                  }
                  
                  const result = await createDiscussion(status.repoId, category.id, config.post.title, body);
                  
                  if (result.success) {
                    console.log('   ✅ Created: ' + result.discussion.url);
                    results.push({ category: config.categoryName, title: config.post.title, status: 'created', url: result.discussion.url });
                  } else {
                    console.log('   ❌ Failed: ' + result.error);
                    if (result.error.includes('already exists') || result.error.includes('duplicate')) {
                      console.log('   ℹ️  A discussion with this title may already exist.');
                    }
                    results.push({ category: config.categoryName, title: config.post.title, status: 'failed', error: result.error });
                  }
                  console.log('');
                }
                
                // Summary
                const created = results.filter(r => r.status === 'created').length;
                const failed = results.filter(r => r.status === 'failed').length;
                const skipped = results.filter(r => r.status === 'skipped').length;
                
                console.log('═══════════════════════════════════════════════════');
                console.log('📊 Summary');
                console.log('═══════════════════════════════════════════════════');
                console.log('Created:  ' + created + ' ✅');
                console.log('Failed:   ' + failed + ' ❌');
                console.log('Skipped:  ' + skipped + ' ⏭️');
                console.log('');
                
                if (created > 0) {
                  console.log('✅ Successfully Created:');
                  results.filter(r => r.status === 'created').forEach(r => {
                    console.log('   - ' + r.title);
                    console.log('     ' + r.url);
                  });
                }
                
                if (skipped > 0) {
                  console.log('\n⚠️  Skipped (create categories first):');
                  results.filter(r => r.status === 'skipped').forEach(r => {
                    console.log('   - ' + r.category);
                  });
                }
                
                // Save results
                fs.writeFileSync('setup-results.json', JSON.stringify({
                  timestamp: new Date().toISOString(),
                  action: action,
                  results: results,
                  summary: { created: created, failed: failed, skipped: skipped }
                }, null, 2));
                
                console.log('\n📝 Results saved to: setup-results.json');
                
                if (created === 0 && (failed > 0 || skipped > 0)) {
                  core.setFailed('No discussions were created. Check errors above.');
                }
              }
              
            } catch (error) {
              console.error('\n❌ Workflow failed:', error.message);
              core.setFailed(error.message);
            }
            
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-results
          path: setup-results.json
          if-no-files-found: ignore
