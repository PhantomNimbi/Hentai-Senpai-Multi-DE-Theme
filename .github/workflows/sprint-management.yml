name: Sprint Management

on:
  schedule:
    # Run every Monday at 9 AM UTC (start of week)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: 'Sprint action'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - close
          - review

jobs:
  sprint-management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Sprint Actions
        uses: actions/github-script@v7
        with:
          script: |
            const action = context.payload.inputs?.action || 'review';
            
            if (action === 'create') {
              console.log('🚀 Creating new sprint...');
              // Logic to create new sprint milestone
              const today = new Date();
              const sprintNumber = Math.ceil((today - new Date(today.getFullYear(), 0, 1)) / (1000 * 60 * 60 * 24 * 14)) + 1;
              const sprintEnd = new Date(today.getTime() + (14 * 24 * 60 * 60 * 1000));
              
              await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Sprint ${sprintNumber}`,
                description: `🏃 Sprint ${sprintNumber} - Theme development sprint`,
                due_on: sprintEnd.toISOString()
              });
              
              console.log(`✅ Created Sprint ${sprintNumber} ending on ${sprintEnd.toDateString()}`);
              
            } else if (action === 'close') {
              console.log('🏁 Closing current sprint...');
              // Logic to close current sprint and move incomplete items
              
              const milestones = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });
              
              if (milestones.data.length > 0) {
                const currentSprint = milestones.data[0];
                
                // Get all open issues in current sprint
                const issues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  milestone: currentSprint.number,
                  state: 'open'
                });
                
                console.log(`📊 Sprint ${currentSprint.title} Summary:`);
                console.log(`- Open issues: ${issues.data.length}`);
                
                // Label incomplete items for next sprint
                for (const issue of issues.data) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: ['status: rolled-over']
                  });
                }
              }
              
            } else if (action === 'review') {
              console.log('📊 Generating sprint report...');
              
              // Get project statistics
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100
              });
              
              const openIssues = issues.data.filter(i => i.state === 'open');
              const closedIssues = issues.data.filter(i => i.state === 'closed');
              const bugs = issues.data.filter(i => i.labels.some(l => l.name.includes('bug')));
              const features = issues.data.filter(i => i.labels.some(l => l.name.includes('feature')));
              
              console.log('📈 Project Statistics:');
              console.log(`- Total Issues: ${issues.data.length}`);
              console.log(`- Open: ${openIssues.length}`);
              console.log(`- Closed: ${closedIssues.length}`);
              console.log(`- Bugs: ${bugs.length}`);
              console.log(`- Features: ${features.length}`);
              
              // Create issue for sprint review
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Sprint Review - ${new Date().toLocaleDateString()}`,
                body: `## Sprint Statistics
                
                - **Total Issues:** ${issues.data.length}
                - **Open:** ${openIssues.length}
                - **Closed:** ${closedIssues.length}
                - **Completion Rate:** ${((closedIssues.length / issues.data.length) * 100).toFixed(1)}%
                
                ### By Type
                - 🐛 Bugs: ${bugs.length}
                - ✨ Features: ${features.length}
                
                ### Action Items
                - [ ] Review incomplete items
                - [ ] Plan next sprint
                - [ ] Update roadmap`,
                labels: ['type: meta', 'status: review']
              });
            }
