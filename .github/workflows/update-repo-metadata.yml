name: Update Repository Metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-repo-metadata.yml'
  workflow_dispatch:

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      repository-projects: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Update repository description and topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Repository description
          DESCRIPTION="A beautiful dark GTK theme based on Orchis with the Nord color palette. Supports GNOME, Cinnamon, XFCE, Budgie, and MATE."
          
          # Repository topics
          TOPICS='["gtk-theme", "gtk", "gnome", "cinnamon", "xfce", "budgie", "mate", "linux", "theme", "nord", "orchis", "dark-theme", "material-design", "gtk3", "gtk4", "gnome-shell", "desktop-environment", "linux-theme", "ricing", "customization"]'
          
          # Update repository description and homepage
          curl -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO_OWNER/$REPO_NAME \
            -d "{
              \"description\": \"$DESCRIPTION\",
              \"homepage\": \"https://github.com/$REPO_OWNER/$REPO_NAME#readme\",
              \"topics\": $TOPICS
            }"
          
          echo "Repository metadata updated successfully!"
          echo "Description: $DESCRIPTION"
          echo "Topics: $TOPICS"
