name: Update Repository Metadata

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/${{ github.repository }} \
            -f description="A beautiful dark GTK theme based on Orchis with the Nord color palette. Supports GNOME, Cinnamon, XFCE, Budgie, and MATE desktop environments." \
            -f homepage="https://github.com/${{ github.repository }}#readme"
          
          echo "✅ Repository description updated"
      
      - name: Update repository topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use gh CLI to replace all topics
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/${{ github.repository }}/topics \
            -f names='["gtk-theme", "gtk", "gtk3", "gtk4", "gnome", "gnome-shell", "cinnamon", "xfce", "xfwm4", "budgie", "mate", "linux", "linux-theme", "theme", "dark-theme", "nord", "nord-theme", "orchis", "material-design", "desktop-environment", "ricing", "unixporn", "customization", "opencode", "ai-assisted"]'
          
          echo "✅ Repository topics updated"
          echo "🏷️  Topics set: gtk-theme, gtk, gtk3, gtk4, gnome, gnome-shell, cinnamon, xfce, xfwm4, budgie, mate, linux, linux-theme, theme, dark-theme, nord, nord-theme, orchis, material-design, desktop-environment, ricing, unixporn, customization, opencode, ai-assisted"
