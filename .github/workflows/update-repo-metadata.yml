name: Update Repository Metadata

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Update repository description and topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repository description
          DESCRIPTION="A beautiful dark GTK theme based on Orchis with the Nord color palette. Supports GNOME, Cinnamon, XFCE, Budgie, and MATE desktop environments."
          
          # Repository topics - optimized for GTK theme discovery
          TOPICS='["gtk-theme", "gtk", "gtk3", "gtk4", "gnome", "gnome-shell", "cinnamon", "xfce", "xfwm4", "budgie", "mate", "linux", "linux-theme", "theme", "dark-theme", "nord", "nord-theme", "orchis", "material-design", "desktop-environment", "ricing", "unixporn", "customization", "opencode", "ai-assisted"]'
          
          # Update repository using GitHub API
          curl -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }} \
            -d "{
              \"description\": \"$DESCRIPTION\",
              \"homepage\": \"https://github.com/${{ github.repository }}#readme\",
              \"topics\": $TOPICS,
              \"has_issues\": true,
              \"has_discussions\": true,
              \"has_wiki\": false
            }"
          
          echo "✅ Repository metadata updated successfully!"
          echo "📋 Description: $DESCRIPTION"
          echo "🏷️  Topics: $(echo $TOPICS | jq -r '. | join(", ")')"
