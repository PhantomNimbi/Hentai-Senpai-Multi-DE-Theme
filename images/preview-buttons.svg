<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="100" fill="#2d2d2d"/>
  
  <!-- Titlebar -->
  <rect x="0" y="0" width="300" height="36" fill="#f5f5f5"/>
  
  <!-- macOS Buttons -->
  <circle cx="20" cy="18" r="8" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="8" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="8" fill="#28ca42"/>
  
  <!-- Button labels -->
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Close</text>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Minimize</text>
  <text x="64" y="50" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Maximize</text>
  
  <!-- Sample buttons -->
  <rect x="100" y="60" width="80" height="28" rx="4" fill="#3d3d3d" stroke="#444444" stroke-width="1"/>
  <text x="140" y="78" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Button</text>
</svg>
