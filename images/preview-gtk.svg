<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Background -->
  <rect x="10" y="10" width="380" height="280" rx="8" fill="#2d2d2d"/>
  
  <!-- Titlebar with macOS buttons -->
  <rect x="10" y="10" width="380" height="36" rx="8" fill="#f5f5f5"/>
  <rect x="10" y="38" width="380" height="10" fill="#e8e8e8"/>
  
  <!-- macOS Buttons -->
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="28" r="6" fill="#28ca42"/>
  
  <!-- Title -->
  <text x="200" y="32" font-family="Arial, sans-serif" font-size="12" fill="#2d2d2d" text-anchor="middle">Hentai-Senpai Theme</text>
  
  <!-- Content area -->
  <rect x="20" y="56" width="180" height="220" rx="4" fill="#252525"/>
  <rect x="210" y="56" width="170" height="220" rx="4" fill="#1e1e1e"/>
  
  <!-- Sample UI elements -->
  <rect x="30" y="66" width="160" height="20" rx="4" fill="#333333"/>
  <rect x="30" y="94" width="160" height="20" rx="4" fill="#3584e4"/>
  <rect x="30" y="122" width="100" height="24" rx="4" fill="#3d3d3d"/>
  
  <text x="220" y="70" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Content Area</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">Sidebar</text>
</svg>
